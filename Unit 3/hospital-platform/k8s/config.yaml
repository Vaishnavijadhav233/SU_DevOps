apiVersion: v1
kind: ConfigMap
metadata:
  name: hospital-config
data:
  POSTGRES_DB: hospitaldb
  POSTGRES_USER: hospital
---
apiVersion: v1
kind: Secret
metadata:
  name: hospital-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: hospital123
  SECRET_KEY: change-me-in-prod
  DATABASE_URL: postgresql://hospital:hospital123@postgres:5432/hospitaldb
