services:
  library:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - library-data:/data
    restart: unless-stopped

volumes:
  library-data:
