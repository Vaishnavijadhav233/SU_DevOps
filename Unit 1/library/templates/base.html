<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Management Platform</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1><a href="{{ url_for('home') }}">📚 Library Management Platform</a></h1>
  <nav>
    <a href="{{ url_for('home') }}">Books</a>
    {% if session.admin %}
      <a href="{{ url_for('members') }}">Members</a>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <form method="post" action="{{ url_for('logout') }}" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="link">Logout</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Librarian login</a>
    {% endif %}
  </nav>
</header>
<main>
  {% for cat, m in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ m }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
